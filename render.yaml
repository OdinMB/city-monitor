databases:
  - name: city-monitor-db
    plan: starter
    region: frankfurt
    databaseName: city_monitor
    user: city_monitor

services:
  # --- API Server ---
  - type: web
    name: city-monitor-api
    runtime: node
    plan: starter
    region: frankfurt
    # --include=dev: NODE_ENV=production omits devDependencies, but the build needs
    # the pinned TypeScript and @types/*, and the start command's db:migrate needs
    # tsx. See .context/deployment.md.
    buildCommand: npm ci --include=dev && npm run build --workspace=shared && npm run build --workspace=packages/server
    startCommand: npm run db:migrate --workspace=packages/server && node packages/server/dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: ACTIVE_CITIES
        value: berlin,hamburg,koeln,muenchen
      - key: DATABASE_URL
        fromDatabase:
          name: city-monitor-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      # Hamburg transit (Geofox GTI): credentials Hochbahn issued to City Monitor; a fork requests its own
      - key: GEOFOX_USER
        sync: false
      - key: GEOFOX_PASSWORD
        sync: false
      # Lifts and escalators at DB stations (FaSta): a DB API Marketplace application's client id and API key
      - key: DB_API_CLIENT_ID
        sync: false
      - key: DB_API_KEY
        sync: false
      # Hamburg events (Hamburg Tourismus' Veranstaltungsdatenbank, FTPS): the login HHT issued to
      # City Monitor under its contract; a fork needs its own contract and login
      - key: HHT_FTP_USER
        sync: false
      - key: HHT_FTP_PASSWORD
        sync: false
      # Optional: another host or file than the config's ftp.infomaxnet.de/hamburg25.xml.zip
      - key: HHT_FTP_HOST
        sync: false
      - key: HHT_FTP_FILE
        sync: false
      # Optional opt-out: false hides Hamburg Tourismus' events everywhere (on when unset)
      - key: HHT_EVENTS
        sync: false
      # While HHT's events are in preview (HHT_PREVIEW_ONLY in lib/hht-gate.ts), only requests
      # with this token (16+ characters) see them; unset, no preview is possible
      - key: HHT_EVENTS_PREVIEW_TOKEN
        sync: false
      # Optional opt-out: false hides the Bundes-Klinik-Atlas hospitals (on when unset)
      - key: KLINIK_ATLAS
        sync: false
      - key: SENTRY_DSN
        sync: false

  # --- Static Frontend ---
  - type: web
    name: city-monitor-web
    runtime: static
    # --include=dev: Vite, TypeScript and @types/* are devDependencies. See .context/deployment.md.
    buildCommand: npm ci --include=dev && npm run build --workspace=packages/web
    staticPublishPath: packages/web/dist
    envVars:
      # Build time: the browser calls the API on its own address, not through
      # the /api/* rewrite below. See .context/deployment.md.
      - key: VITE_API_BASE
        value: https://api.citymonitor.app/api
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=300
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://scripts.simpleanalyticscdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.citymonitor.app https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://gdi.berlin.de https://geodienste.hamburg.de https://www.wms.nrw.de https://geoportal.stadt-koeln.de; font-src 'self'; connect-src 'self' https://api.citymonitor.app https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://gdi.berlin.de https://geodienste.hamburg.de https://www.wms.nrw.de https://geoportal.stadt-koeln.de https://queue.simpleanalyticscdn.com; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    routes:
      # Serves only tabs opened before VITE_API_BASE was set (they still call
      # /api); can go once those are gone. See .context/deployment.md.
      - type: rewrite
        source: /api/*
        destination: https://city-monitor-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
